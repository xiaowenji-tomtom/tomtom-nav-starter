org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# TomTom API Key —— 从 developer.tomtom.com 或项目发放渠道获取后填入。
# 注意：量产工程中 Key 经 AMS 鉴权下发（见 :core:sdk auth 包），此处仅供 Stub 模式开发联调。
tomtomApiKey=YOUR_TOMTOM_API_KEY

# NavSDK 版本（须与 onboard-switch 附加模块 AAR 的编译版本一致）
tomtomSdkVersion=2.3.1
